function log(msg, cls) {
  const el = document.getElementById("log");
  el.style.display = "block";
  el.innerHTML += `<div class="${cls||''}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

window.runSeed = async function() {
  const btn = document.getElementById("btn");
  btn.disabled = true;
  btn.textContent = "Connecting to Firebase…";

  try {
    // Load the site's own firebase config
    const cfg = await import("./firebase/firebase-config.js");
    if (!cfg.firebaseConfig || String(cfg.firebaseConfig.apiKey).startsWith("PASTE")) {
      log("❌ Firebase not configured in firebase-config.js", "err");
      btn.disabled = false; btn.textContent = "Retry";
      return;
    }

    const { initializeApp, getApps } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getFirestore, doc, setDoc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");

    const app = getApps().length ? getApps()[0] : initializeApp(cfg.firebaseConfig);
    const db = getFirestore(app);

    log(`Connected to Firebase. Seeding ${PRODUCTS.length} products…`);
    btn.textContent = "Seeding…";

    let added = 0, skipped = 0;

    for (const p of PRODUCTS) {
      try {
        const ref = doc(db, "products", p.id);
        const snap = await getDoc(ref);
        if (snap.exists()) {
          log(`⟳ Skipped (already in Firestore): ${p.name}`, "warn");
          skipped++;
        } else {
          await setDoc(ref, { ...p, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
          log(`✓ Added: ${p.name}`, "ok");
          added++;
        }
      } catch(e) {
        log(`✗ Failed: ${p.name} — ${e.message}`, "err");
      }
    }

    log("─────────────────────────────", "");
    log(`Done! ${added} added to Firestore, ${skipped} already existed.`, "done");
    if (added > 0) log("Refresh your site — products are now live. You can delete this file.", "done");
    btn.textContent = "Seeding Complete ✓";

  } catch(e) {
    log("❌ Error: " + e.message, "err");
    log("Make sure you opened this from your live Vercel site, not as a local file.", "warn");
    btn.disabled = false;
    btn.textContent = "Retry";
  }
};

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Create your AMEER OFFICIAL account for faster checkout, order tracking and wishlist.">

<meta property="og:type" content="website">

<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0b5d5b">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="28" fill="%230b5d5b"/><text x="50" y="70" font-size="58" font-weight="800" font-family="Arial,sans-serif" fill="%23fff" text-anchor="middle">A</text></svg>'>
<link rel="preload" href="assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="modulepreload" href="js/navbar.js">
<link rel="modulepreload" href="js/utils.js">
<link rel="modulepreload" href="firebase/firebase-config.js">

</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="navbar"></div>
<div class="auth-wrap" id="main">
  <div class="auth-card">
    <h1>Join AMEER OFFICIAL</h1>
    <p class="auth-sub">Create an account for faster checkout &amp; order tracking</p>
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" autocomplete="name" placeholder="Your name">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" autocomplete="new-password" placeholder="At least 6 characters">
        <button type="button" id="pwToggle">Show</button>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="submitBtn">Create account</button>
    <div class="auth-alt">Already have an account? <a href="login.html">Sign in</a></div>
    <p class="form-note">By creating an account you agree to AMEER OFFICIAL's Terms &amp; Privacy Policy.</p>
  </div>
</div>
<div id="footer"></div>
<script type="module" src="js/signup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Import — AMEER OFFICIAL</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#f4f2ef;min-height:100vh;color:#111}
.top-bar{background:#111;color:#fff;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.top-bar h1{font-size:16px;font-weight:500;letter-spacing:.05em}
.top-bar .status{font-size:12px;color:#888;display:flex;align-items:center;gap:8px}
.top-bar .dot{width:8px;height:8px;border-radius:50%;background:#555}
.top-bar .dot.on{background:#4caf50}
.tabs{background:#fff;border-bottom:1px solid #e0e0e0;display:flex;padding:0 32px;gap:0;overflow-x:auto}
.tab{padding:14px 20px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:#888;transition:all .15s;white-space:nowrap}
.tab.active{color:#111;border-color:#111}
.toolbar{padding:16px 32px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid #e0e0e0;flex-wrap:wrap}
.toolbar button{padding:9px 18px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #ddd;background:#fff;color:#111;transition:all .15s}
.toolbar button.primary{background:#111;color:#fff;border-color:#111}
.toolbar button.primary:hover:not(:disabled){background:#333}
.toolbar button:disabled{opacity:.5;cursor:default}
.toolbar button:hover:not(:disabled){border-color:#999}
.toolbar .count{font-size:12px;color:#888;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:24px 32px}
.card{background:#fff;border-radius:10px;overflow:hidden;border:2px solid transparent;transition:border-color .15s;position:relative;cursor:pointer}
.card.selected{border-color:#111}
.card-check{position:absolute;top:10px;left:10px;width:22px;height:22px;border-radius:50%;border:2px solid #ddd;background:#fff;display:flex;align-items:center;justify-content:center;z-index:2;transition:all .15s}
.card.selected .card-check{background:#111;border-color:#111}
.card-check::after{content:'✓';color:#fff;font-size:11px;font-weight:700;display:none}
.card.selected .card-check::after{display:block}
.card-img{position:relative;aspect-ratio:3/4;background:#f0ede8;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.img-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:#aaa}
.img-placeholder svg{width:36px;height:36px;opacity:.4}
.img-placeholder span{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.img-badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.65);color:#fff;border-radius:4px;padding:2px 7px;font-size:10px;letter-spacing:.06em}
.img-badge.has{background:#2e7d32}
.card-body{padding:14px}
.card-collection{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#888;margin-bottom:4px}
.card-name{font-size:14px;font-weight:600;line-height:1.3;margin-bottom:6px}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:500}
.pill-price{background:#f0ede8;color:#111}
.pill-stock{background:#e8f5e9;color:#2e7d32}
.swatch{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.1);flex-shrink:0}
.progress-bar{height:3px;background:#e0e0e0;border-radius:2px;overflow:hidden;margin:16px 32px 0;display:none}
.progress-fill{height:100%;background:#111;border-radius:2px;transition:width .3s}
.log-panel{margin:16px 32px 32px;background:#fff;border-radius:10px;border:1px solid #e0e0e0;overflow:hidden;display:none}
.log-head{padding:12px 16px;background:#f8f8f8;border-bottom:1px solid #e0e0e0;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.log-body{padding:14px 16px;max-height:240px;overflow-y:auto;font-size:12.5px;line-height:1.9;font-family:ui-monospace,monospace}
.log-body .ok{color:#2e7d32}
.log-body .err{color:#c62828}
.log-body .done{color:#1565c0;font-weight:600}
.log-body .warn{color:#e65100}
.section-head{padding:16px 32px 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:600}
@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,1fr);padding:16px;gap:12px}
  .toolbar,.top-bar{padding:12px 16px}
  .section-head{padding:12px 16px 4px}
  .log-panel{margin:12px 16px 24px}
}
</style>
</head>
<body>

<div class="top-bar">
  <h1>AMEER OFFICIAL — Product Import</h1>
  <div class="status"><div class="dot" id="fbDot"></div><span id="fbStatus">Checking Firebase…</span></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="setTab('all',this)">All (20)</div>
  <div class="tab" onclick="setTab('salina-vol24',this)">Salina Vol-24 (10)</div>
  <div class="tab" onclick="setTab('regalia-emb-2026',this)">Regalia Luxury Emb (10)</div>
</div>

<div class="toolbar">
  <button onclick="selectAll()">Select All</button>
  <button onclick="selectNone()">Deselect All</button>
  <button class="primary" id="seedBtn" onclick="seedSelected()" disabled>Seed Selected to Firestore</button>
  <span class="count" id="selCount">0 selected</span>
</div>

<div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<div id="gridContainer"></div>

<div class="log-panel" id="logPanel">
  <div class="log-head">Import Log <span id="logSummary" style="color:#888;font-weight:400;font-size:12px"></span></div>
  <div class="log-body" id="logBody"></div>
</div>

<script type="module">
// ═══════════════════════════════════════════════════════════════════════════
// Images are served from your own site (uploaded to GitHub alongside this
// file). Products are saved with those image paths — no manual upload needed.
// ═══════════════════════════════════════════════════════════════════════════

  {id:"SALINA-V24-005",name:"Salina Sky Blue Floral 3-Piece Lawn",collection:"salina-vol24",price:3900,colors:[{name:"Sky Blue",hex:"#5BA3C9"}],img:"SALINA-V24-005.jpg",desc:"Soft sky blue with digital floral print on premium lawn shirt. Luxury digital printed voile lawn dupatta and dyed cambric trouser.\nCollection: Salina Digital Printed Lawn Vol-24 2026 by Regalia Textiles\nSize: Unstitched — cut and stitch as per your measurements."},
  {id:"SALINA-V24-006",name:"Salina Lime Green 3-Piece Lawn",collection:"salina-vol24",price:3900,colors:[{name:"Lime Green",hex:"#A8C84A"}],img:"SALINA-V24-006.jpg",desc:"Fresh lime green with floral digital print on premium lawn shirt. Luxury digital printed voile lawn dupatta and dyed cambric trouser.\nCollection: Salina Digital Printed Lawn Vol-24 2026 by Regalia Textiles\nSize: Unstitched — cut and stitch as per your measurements."},
  {id:"SALINA-V24-007",name:"Salina Yellow Floral 3-Piece Lawn",collection:"salina-vol24",price:3900,colors:[{name:"Yellow",hex:"#E8D44D"}],img:"SALINA-V24-007.jpg",desc:"Bright yellow with all-over floral digital print on premium lawn shirt. Luxury digital printed voile lawn dupatta and dyed cambric trouser.\nCollection: Salina Digital Printed Lawn Vol-24 2026 by Regalia Textiles\nSize: Unstitched — cut and stitch as per your measurements."},
  {id:"SALINA-V24-008",name:"Salina Mustard Floral 3-Piece Lawn",collection:"salina-vol24",price:3900,colors:[{name:"Mustard",hex:"#C9921A"}],img:"SALINA-V24-008.jpg",desc:"Rich mustard with bold floral digital print on premium lawn shirt. Luxury digital printed voile lawn dupatta and dyed cambric trouser.\nCollection: Salina Digital Printed Lawn Vol-24 2026 by Regalia Textiles\nSize: Unstitched — cut and stitch as per your measurements."},
  {id:"SALINA-V24-009",name:"Salina Coral Floral 3-Piece Lawn",collection:"salina-vol24",price:3900,colors:[{name:"Coral",hex:"#E8825A"}],img:"SALINA-V24-009.jpg",desc:"Warm coral with elegant floral digital print on premium lawn shirt. Luxury digital printed voile lawn dupatta and dyed cambric trouser.\nCollection: Salina Digital Printed Lawn Vol-24 2026 by Regalia Textiles\nSize: Unstitched — cut and stitch as per your measurements."},
  {id:"SALINA-V24-010",name:"Salina Peach Floral 3-Piece Lawn",collection:"salina-vol24",price:3900,colors:[{name:"Peach",hex:"#F4A883"}],img:"SALINA-V24-010.jpg",desc:"Soft peach with all-over floral digital print on premium lawn shirt. Luxury digital printed voile lawn dupatta and dyed cambric trouser.\nCollection: Salina Digital Printed Lawn Vol-24 2026 by Regalia Textiles\nSize: Unstitched — cut and stitch as per your measurements."},
  // ── REGALIA LUXURY EMB ──
  {id:"REGALIA-EMB-001",name:"Regalia Black Diamond Embroidered 3-Piece Lawn",collection:"regalia-emb-2026",price:4000,colors:[{name:"Black",hex:"#1A1A1A"}],img:"REGALIA-EMB-001.jpg",desc:"Striking black with white diamond lattice ChikanKari embroidered lawn shirt. Digital printed lawn dupatta and plain cambric trouser.\nCollection: Regalia Luxury Embroidered Lawn Collection 2026\nSize: Unstitched — cut and stitch as per your measurements."},
  {id:"REGALIA-EMB-002",name:"Regalia Purple Floral Embroidered 3-Piece Lawn",collection:"regalia-emb-2026",price:4000,colors:[{name:"Lilac Purple",hex:"#9B7FBF"}],img:"REGALIA-EMB-002.jpg",desc:"Elegant lilac purple ChikanKari embroidered floral lawn shirt. Digital printed purple dupatta and plain cambric trouser.\nCollection: Regalia Luxury Embroidered Lawn Collection 2026\nSize: Unstitched — cut and stitch as per your measurements."},
  {id:"REGALIA-EMB-003",name:"Regalia Blue Floral Embroidered 3-Piece Lawn",collection:"regalia-emb-2026",price:4000,colors:[{name:"Powder Blue",hex:"#A8C8E8"}],img:"REGALIA-EMB-003.jpg",desc:"Beautiful powder blue ChikanKari embroidered floral lawn shirt with scallop hem. Digital printed blue dupatta and plain cambric trouser.\nCollection: Regalia Luxury Embroidered Lawn Collection 2026\nSize: Unstitched — cut and stitch as per your measurements."},
  {id:"REGALIA-EMB-004",name:"Regalia Maroon Floral Embroidered 3-Piece Lawn",collection:"regalia-emb-2026",price:4000,colors:[{name:"Maroon",hex:"#7B2D3E"}],img:"REGALIA-EMB-004.jpg",desc:"Deep maroon diamond lattice ChikanKari embroidered lawn shirt. Digital printed dark dupatta and plain cambric trouser.\nCollection: Regalia Luxury Embroidered Lawn Collection 2026\nSize: Unstitched — cut and stitch as per your measurements."},
  {id:"REGALIA-EMB-005",name:"Regalia Sky Blue Embroidered 3-Piece Lawn",collection:"regalia-emb-2026",price:4000,colors:[{name:"Sky Blue",hex:"#7BC8E8"}],img:"REGALIA-EMB-005.jpg",desc:"Soft sky blue ChikanKari embroidered motifs on lawn shirt with scallop border. Chevron printed dupatta and plain cambric trouser.\nCollection: Regalia Luxury Embroidered Lawn Collection 2026\nSize: Unstitched — cut and stitch as per your measurements."},
  {id:"REGALIA-EMB-006",name:"Regalia Lime Green Embroidered 3-Piece Lawn",collection:"regalia-emb-2026",price:4000,colors:[{name:"Lime Green",hex:"#A8C84A"}],img:"REGALIA-EMB-006.jpg",desc:"Fresh lime green ChikanKari floral embroidered lawn shirt. Digital printed lime dupatta and plain cambric trouser.\nCollection: Regalia Luxury Embroidered Lawn Collection 2026\nSize: Unstitched — cut and stitch as per your measurements."},
  {id:"REGALIA-EMB-007",name:"Regalia Yellow Embroidered 3-Piece Lawn",collection:"regalia-emb-2026",price:4000,colors:[{name:"Yellow",hex:"#E8D44D"}],img:"REGALIA-EMB-007.jpg",desc:"Bright yellow ChikanKari embroidered diamond motifs on lawn shirt with sequin detailing. Digital printed yellow dupatta and plain cambric trouser.\nCollection: Regalia Luxury Embroidered Lawn Collection 2026\nSize: Unstitched — cut and stitch as per your measurements."},
  {id:"REGALIA-EMB-008",name:"Regalia Mustard Black Embroidered 3-Piece Lawn",collection:"regalia-emb-2026",price:4000,colors:[{name:"Mustard",hex:"#C9921A"}],img:"REGALIA-EMB-008.jpg",desc:"Bold mustard with black floral ChikanKari embroidered lawn shirt. Lace trim and scallop border with digital printed dupatta and plain cambric trouser.\nCollection: Regalia Luxury Embroidered Lawn Collection 2026\nSize: Unstitched — cut and stitch as per your measurements."},
  {id:"REGALIA-EMB-009",name:"Regalia Coral Embroidered 3-Piece Lawn",collection:"regalia-emb-2026",price:4000,colors:[{name:"Coral",hex:"#E8825A"}],img:"REGALIA-EMB-009.jpg",desc:"Warm coral ChikanKari embroidered floral lawn shirt with eyelet border. Digital printed dupatta and plain cambric trouser.\nCollection: Regalia Luxury Embroidered Lawn Collection 2026\nSize: Unstitched — cut and stitch as per your measurements."},
  {id:"REGALIA-EMB-010",name:"Regalia Peach ChikanKari Embroidered 3-Piece Lawn",collection:"regalia-emb-2026",price:4000,colors:[{name:"Peach",hex:"#F4A883"}],img:"REGALIA-EMB-010.jpg",desc:"Soft peach all-over ChikanKari embroidered lawn shirt with elegant lace trim. Digital printed dupatta and plain cambric trouser.\nCollection: Regalia Luxury Embroidered Lawn Collection 2026\nSize: Unstitched — cut and stitch as per your measurements."},
];

const COLLECTION_LABELS = {
  "salina-vol24":    "Salina Vol-24 '26 · Rs. 3,900",
  "regalia-emb-2026":"Regalia Luxury Emb '26 · Rs. 4,000",
};
const SPECS = {
  "salina-vol24":    {Fabric:"Digital Printed Lawn",Pieces:"3-Piece",Shirt:"Digital Printed Lawn",Dupatta:"Digital Printed Voile Lawn",Trouser:"Dyed Cambric",Type:"Unstitched",Brand:"Regalia Textiles"},
  "regalia-emb-2026":{Fabric:"ChikanKari Embroidered Lawn",Pieces:"3-Piece",Shirt:"ChikanKari Embroidered Lawn",Dupatta:"Digital Printed Lawn",Trouser:"Plain Cambric",Type:"Unstitched",Brand:"Regalia Textiles"},
};

const state = { selected: new Set(), tab: "all", db: null, fbReady: false };

function imgPath(p) { return IMG_BASE[p.collection] + p.img; }

async function initFb() {
  try {
    const cfg = await import("./firebase/firebase-config.js");
    if (!cfg.firebaseConfig || String(cfg.firebaseConfig.apiKey).startsWith("PASTE")) throw new Error("not configured");
    const { initializeApp, getApps } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getFirestore } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const app = getApps().length ? getApps()[0] : initializeApp(cfg.firebaseConfig);
    state.db = getFirestore(app);
    state.fbReady = true;
    document.getElementById("fbDot").classList.add("on");
    document.getElementById("fbStatus").textContent = "Firebase connected";
    document.getElementById("seedBtn").disabled = false;
  } catch(e) {
    document.getElementById("fbStatus").textContent = "Firebase not connected — open from live site";
  }
}

function visible() {
  return state.tab === "all" ? PRODUCTS : PRODUCTS.filter(p => p.collection === state.tab);
}

function render() {
  const container = document.getElementById("gridContainer");
  const prods = visible();
  let html = "";

  const groups = state.tab === "all"
    ? [{label:"Salina Digital Printed Lawn Vol-24 2026", items:prods.filter(p=>p.collection==="salina-vol24")},
       {label:"Regalia Luxury Embroidered Lawn 2026",    items:prods.filter(p=>p.collection==="regalia-emb-2026")}]
    : [{label: state.tab==="salina-vol24" ? "Salina Digital Printed Lawn Vol-24 2026" : "Regalia Luxury Embroidered Lawn 2026", items:prods}];

  for (const g of groups) {
    if (!g.items.length) continue;
    html += `<div class="section-head">${g.label}</div><div class="grid">`;
    for (const p of g.items) {
      const sel = state.selected.has(p.id);
      html += `
      <div class="card ${sel?"selected":""}" id="card-${p.id}" onclick="toggleSelect('${p.id}')">
        <div class="card-check"></div>
        <div class="card-img">
          <img src="${imgPath(p)}" alt="${p.name}"
               onerror="this.style.display='none';this.parentElement.querySelector('.img-badge').textContent='Image missing';this.parentElement.querySelector('.img-badge').classList.remove('has')">
          <span class="img-badge has">✓ Auto image</span>
        </div>
        <div class="card-body">
          <div class="card-collection">${COLLECTION_LABELS[p.collection]}</div>
          <div class="card-name">${p.name}</div>
          <div class="card-meta">
            <span class="pill pill-price">Rs. ${p.price.toLocaleString()}</span>
            <span class="pill pill-stock">Stock: 10</span>
            <span class="swatch" style="background:${p.colors[0].hex}" title="${p.colors[0].name}"></span>
          </div>
        </div>
      </div>`;
    }
    html += "</div>";
  }
  container.innerHTML = html;
  updateCount();
}

function updateCount() {
  const sel = state.selected.size;
  document.getElementById("selCount").textContent = `${sel} selected`;
  document.getElementById("seedBtn").textContent = sel
    ? `Seed ${sel} Product${sel!==1?"s":""} to Firestore`
    : "Seed Selected to Firestore";
}

window.setTab = (tab, el) => {
  state.tab = tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  render();
};
window.toggleSelect = (id) => {
  if (state.selected.has(id)) state.selected.delete(id);
  else state.selected.add(id);
  const card = document.getElementById(`card-${id}`);
  if (card) card.classList.toggle("selected", state.selected.has(id));
  updateCount();
};
window.selectAll = () => { visible().forEach(p=>state.selected.add(p.id)); render(); };
window.selectNone = () => { state.selected.clear(); render(); };

window.seedSelected = async () => {
  if (!state.fbReady) { alert("Firebase not connected. Open this page from your live Vercel site."); return; }
  const toSeed = PRODUCTS.filter(p => state.selected.has(p.id));
  if (!toSeed.length) { alert("Select at least one product first."); return; }

  const btn = document.getElementById("seedBtn");
  btn.disabled = true;

  const logPanel = document.getElementById("logPanel");
  const logBody = document.getElementById("logBody");
  logPanel.style.display = "block";
  logBody.innerHTML = "";

  const progressBar = document.getElementById("progressBar");
  const progressFill = document.getElementById("progressFill");
  progressBar.style.display = "block";
  progressFill.style.width = "0%";

  function log(msg, cls) {
    logBody.innerHTML += `<div class="${cls||''}">${msg}</div>`;
    logBody.scrollTop = logBody.scrollHeight;
  }

  const { doc, setDoc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");

  let added = 0, skipped = 0, failed = 0;
  log(`Starting seed of ${toSeed.length} products…`);

  for (let i = 0; i < toSeed.length; i++) {
    const p = toSeed[i];
    progressFill.style.width = `${Math.round((i/toSeed.length)*100)}%`;

    try {
      const snap = await getDoc(doc(state.db, "products", p.id));
      if (snap.exists()) { log(`⟳ Skipped (exists): ${p.name}`, "warn"); skipped++; continue; }

      // Verify image exists on the site
      const path = imgPath(p);
      let imageOk = false;
      try {
        const res = await fetch(path, { method: "HEAD" });
        imageOk = res.ok;
      } catch {}
      if (!imageOk) log(`  ⚠ Image not found at ${path} — product will still be saved`, "warn");

      const product = {
        id: p.id,
        name: p.name,
        category: "women",
        sub: p.collection === "salina-vol24" ? "Unstitched" : "Embroidered",
        price: p.price,
        salePrice: null,
        stock: 10,
        rating: 4.5,
        collection: p.collection,
        brand: "Regalia Textiles",
        quality: ["Original", "Unstitched"],
        featured: false,
        trending: false,
        bestseller: false,
        isNew: true,
        active: true,
        colors: p.colors,
        sizes: ["Unstitched"],
        image: path,
        images: [path],
        desc: p.desc,
        specs: SPECS[p.collection],
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
      };

      await setDoc(doc(state.db, "products", p.id), product);
      log(`✓ Added: ${p.name}`, "ok");
      added++;
    } catch(e) {
      log(`✗ Failed: ${p.name} — ${e.message}`, "err");
      failed++;
    }
  }

  progressFill.style.width = "100%";
  log("─────────────────────────────", "");
  log(`Done! ${added} added · ${skipped} skipped · ${failed} failed`, "done");
  if (added > 0) log("Go check your Women page — products are live with images!", "done");
  document.getElementById("logSummary").textContent = `${added} added · ${skipped} skipped · ${failed} failed`;
  btn.disabled = false;
};

render();
initFb();
</script>
</body>
</html>

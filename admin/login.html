<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin sign in — AMEER OFFICIAL</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111111">
<link rel="preload" href="../assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="modulepreload" href="../js/auth.js">
<link rel="modulepreload" href="../js/utils.js">
<link rel="modulepreload" href="../firebase/firebase-config.js">
<link rel="modulepreload" href="../js/admin-guard.js">
<link rel="modulepreload" href="../js/admin-data.js">
<link rel="modulepreload" href="../js/products.js">
<link rel="modulepreload" href="../js/admin-team.js">
<link rel="modulepreload" href="../js/email-send.js">
<link rel="modulepreload" href="../js/firebase.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
</head>
<body>
<div class="ad-login">
  <div class="ad-login-card">
    <div class="brand" style="display:flex;justify-content:center">
      <span class="brandmark">
        <span class="brandmark-top">AMEER</span>
        <span class="brandmark-line"></span>
        <span class="brandmark-bottom">OFFICIAL</span>
      </span>
    </div>
    <div class="tag">Admin</div>
    <div class="field">
      <label for="email">Admin email</label>
      <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="Your password">
    </div>
    <button class="btn btn-primary btn-block" id="loginBtn">Sign in to dashboard</button>
    <p class="form-note" id="note"></p>
  </div>
</div>
<script type="module" src="../js/admin-login.js"></script>
</body>
</html>
